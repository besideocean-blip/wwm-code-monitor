name: Scan WWM redemption codes

on:
  schedule:
    - cron: "17,47 * * * *"  # 每 30 分鐘；GitHub 排程可能延後
  workflow_dispatch:
    inputs:
      manual_codes:
        description: "Optional: paste codes here to publish them manually"
        required: false
        type: string
      dry_run:
        description: "Preview sources only; do not post to Discord or update state"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: wwm-code-monitor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: discord-production

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Run tests
        run: node --test

      - name: Scan and notify Discord
        run: node src/sync.js
        env:
          DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_STATE_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          MANUAL_CODES: ${{ github.event.inputs.manual_codes }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          BAHAMUT_SCAN_ENABLED: ${{ vars.BAHAMUT_SCAN_ENABLED || 'true' }}
          BAHAMUT_MAX_PAGES: ${{ vars.BAHAMUT_MAX_PAGES || '8' }}

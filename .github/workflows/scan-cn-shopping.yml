name: Scan WWM CN shopping
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
    - cron: '7 21 * * *'
  push:
    paths:
      - scan_cn_shopping.py
      - discord-product-tags.json
      - .github/workflows/scan-cn-shopping.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan：同步待整理公告並推送已發布商品；preview：只讀取官網'
        type: choice
        default: scan
        options: [scan, preview]
      scope:
        description: 'latest：兩服最新兩頁；full：兩服近 90 天完整補查'
        type: choice
        default: full
        options: [latest, full]
      recover_message_url:
        description: '只有傳送後回執失敗時使用：貼上已存在的 Discord 訊息連結以復原，不會重送'
        type: string
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: wwm-cn-shopping-v1
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: discord-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/announcement-ocr
          key: announcement-ocr-v1-${{ github.run_id }}
          restore-keys: announcement-ocr-v1-
      - name: Install official-announcement image reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-sim
      - name: Collect CN shopping and deliver approved notices
        env:
          MODE: ${{ inputs.mode || 'scan' }}
          SCAN_SCOPE: ${{ github.event_name == 'schedule' && github.event.schedule == '7 21 * * *' && 'full' || inputs.scope || 'latest' }}
          CN_SHOPPING_DISCORD_WEBHOOK_URLS: ${{ secrets.CN_SHOPPING_DISCORD_WEBHOOK_URLS }}
          RECOVER_MESSAGE_URL: ${{ inputs.recover_message_url }}
          PYTHONUNBUFFERED: '1'
          OCR_CACHE_DIR: .cache/announcement-ocr
        run: python scan_cn_shopping.py --mode "$MODE" --scope "$SCAN_SCOPE"

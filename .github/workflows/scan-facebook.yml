name: Scan WWM official Facebook

"on":
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan＝正式掃描；dry-run＝驗證來源；test＝送 RSS 貼文測試卡片"
        type: choice
        required: true
        default: dry-run
        options:
          - scan
          - dry-run
          - test

permissions:
  contents: read
  issues: write

concurrency:
  group: wwm-official-facebook-monitor
  cancel-in-progress: false

jobs:
  scan-facebook:
    # 預設僅手動驗證。來源確認後，把 Repository Variable 設為 true 才定時執行。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FACEBOOK_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: discord-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan official Facebook RSS
        env:
          PYTHONUNBUFFERED: "1"
          GH_REPOSITORY: ${{ github.repository }}
          GH_STATE_TOKEN: ${{ github.token }}
          OFFICIAL_DISCORD_WEBHOOK_URLS: ${{ secrets.OFFICIAL_DISCORD_WEBHOOK_URLS }}
          FACEBOOK_RSS_URL: ${{ secrets.FACEBOOK_RSS_URL }}
          FACEBOOK_STATE_ISSUE_NUMBER: ${{ vars.FACEBOOK_STATE_ISSUE_NUMBER }}
          FACEBOOK_MONITOR_MODE: ${{ inputs.mode || 'scan' }}
        run: python scan_facebook.py
